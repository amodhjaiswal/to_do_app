name: Deploy to Private Azure Server (Full Repo Upload)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Package and Deploy All Files
        env:
          PUBLIC_SERVER_PASSWORD: ${{ secrets.PUBLIC_SERVER_PASSWORD }}
          PRIVATE_SERVER_PASSWORD: ${{ secrets.PRIVATE_SERVER_PASSWORD }}
        run: |
          set -euxo pipefail

          # Create archive (ignore temp/watched folders)
          tar --warning=no-file-changed -czf app.tgz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            .

          # Copy to jump server
          sshpass -p "$PUBLIC_SERVER_PASSWORD" scp -o StrictHostKeyChecking=no app.tgz amodh_vm_user@20.193.147.103:/tmp/app.tgz

          # SSH into jump server and transfer to private server
          sshpass -p "$PUBLIC_SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no amodh_vm_user@20.193.147.103 << 'EOF'
            export PRIVATE_SERVER_PASSWORD='${{ secrets.PRIVATE_SERVER_PASSWORD }}'

            # Copy to private server
            sshpass -p "$PRIVATE_SERVER_PASSWORD" scp -o StrictHostKeyChecking=no /tmp/app.tgz amodh_vm_private@10.0.0.132:/tmp/app.tgz

            # SSH into private server
            sshpass -p "$PRIVATE_SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no amodh_vm_private@10.0.0.132 << 'INNER'
              set -euxo pipefail

              # Prepare deployment directory
              mkdir -p /var/www/myapp
              rm -rf /var/www/myapp/*
              tar xzf /tmp/app.tgz -C /var/www/myapp

              # Install dependencies and restart app
              cd /var/www/myapp
              npm install
              pm2 restart myapp || pm2 start app.js --name myapp

              # Clean up
              rm -f /tmp/app.tgz
            INNER

            # Clean up on public server
            rm -f /tmp/app.tgz
          EOF
