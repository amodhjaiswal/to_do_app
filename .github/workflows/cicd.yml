name: Build and Deploy Node.js App

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Package and Deploy All Files
        env:
          PUBLIC_SERVER_PASSWORD: ${{ secrets.PUBLIC_SERVER_PASSWORD }}
          PRIVATE_SERVER_PASSWORD: ${{ secrets.PRIVATE_SERVER_PASSWORD }}
        run: |
          set -euxo pipefail

          # Create tarball, ignore files that might change during archive
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --ignore-failed-read \
              -czf app.tgz .

          # Copy to public jump host
          sshpass -p "$PUBLIC_SERVER_PASSWORD" scp -o StrictHostKeyChecking=no app.tgz amodh_vm_user@20.193.147.103:/tmp/app.tgz

          # SSH into public jump host
          sshpass -p "$PUBLIC_SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no amodh_vm_user@20.193.147.103 << 'EOF'
            export PRIVATE_SERVER_PASSWORD='${{ secrets.PRIVATE_SERVER_PASSWORD }}'

            # Copy to private server
            sshpass -p "$PRIVATE_SERVER_PASSWORD" scp -o StrictHostKeyChecking=no /tmp/app.tgz amodh_vm_private@10.0.0.132:/tmp/app.tgz

            # SSH into private server and deploy
            sshpass -p "$PRIVATE_SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no amodh_vm_private@10.0.0.132 << 'INNER'
              set -euxo pipefail

              mkdir -p /var/www/myapp
              rm -rf /var/www/myapp/*
              tar xzf /tmp/app.tgz -C /var/www/myapp

              cd /var/www/myapp/src
              node index.js

              rm -f /tmp/app.tgz
            INNER

            rm -f /tmp/app.tgz
          EOF
