name: CI/CD to Private Azure Server

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: ./dist # change if your build folder is different

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ./dist

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to Private Server via Public Jump Host
        env:
          PUBLIC_SERVER_PASSWORD: ${{ secrets.PUBLIC_SERVER_PASSWORD }}
          PRIVATE_SERVER_PASSWORD: ${{ secrets.PRIVATE_SERVER_PASSWORD }}
        run: |
          set -x

          # Copy to jump server
          sshpass -p "$PUBLIC_SERVER_PASSWORD" scp -o StrictHostKeyChecking=no -r ./dist amodh_vm_user@20.193.147.103:/tmp/app

          # SSH into jump server
          sshpass -p "$PUBLIC_SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no amodh_vm_user@20.193.147.103 << 'EOF'
            export PRIVATE_SERVER_PASSWORD=${{ secrets.PRIVATE_SERVER_PASSWORD }}

            # Copy to private server
            sshpass -p "$PRIVATE_SERVER_PASSWORD" scp -o StrictHostKeyChecking=no -r /tmp/app amodh_vm_private@10.0.0.132:/var/www/myapp-temp

            # SSH into private server
            sshpass -p "$PRIVATE_SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no amodh_vm_private@10.0.0.132 << 'INNER'
              set -x
              rm -rf /var/www/myapp/*
              mv /var/www/myapp-temp/* /var/www/myapp/
              rmdir /var/www/myapp-temp

              cd /var/www/myapp
              npm install
              pm2 restart myapp || pm2 start app.js --name myapp
            INNER

            rm -rf /tmp/app
          EOF
