name: Deploy to Private Azure Server (Full Repo + npm install)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to Private Server via Public Jump Host
        env:
          PUBLIC_SERVER_PASSWORD: ${{ secrets.PUBLIC_SERVER_PASSWORD }}
          PRIVATE_SERVER_PASSWORD: ${{ secrets.PRIVATE_SERVER_PASSWORD }}
        run: |
          set -euxo pipefail

          # Archive the entire project (excluding unnecessary files)
          tar czf app.tgz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            .

          # Copy to public jump server
          sshpass -p "$PUBLIC_SERVER_PASSWORD" scp -o StrictHostKeyChecking=no app.tgz amodh_vm_user@20.193.147.103:/tmp/app.tgz

          # SSH into public server and forward to private server
          sshpass -p "$PUBLIC_SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no amodh_vm_user@20.193.147.103 << 'EOF'
            export PRIVATE_SERVER_PASSWORD='${{ secrets.PRIVATE_SERVER_PASSWORD }}'

            # Copy tarball to private server
            sshpass -p "$PRIVATE_SERVER_PASSWORD" scp -o StrictHostKeyChecking=no /tmp/app.tgz amodh_vm_private@10.0.0.132:/tmp/app.tgz

            # SSH into private server and deploy
            sshpass -p "$PRIVATE_SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no amodh_vm_private@10.0.0.132 << 'INNER'
              set -euxo pipefail

              mkdir -p /var/www/myapp
              rm -rf /var/www/myapp/*
              tar xzf /tmp/app.tgz -C /var/www/myapp

              cd /var/www/myapp
              npm install

              # Restart Node.js app with PM2
              pm2 restart myapp || pm2 start app.js --name myapp

              rm -f /tmp/app.tgz
            INNER

            rm -f /tmp/app.tgz
          EOF
